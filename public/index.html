<body class="bg-[#07070a] text-slate-100 font-sans min-h-screen flex flex-col justify-between selection:bg-brand-orange selection:text-black relative">

    <!-- Live Workspace Splitter -->

      <!-- LEFT COLUMN: Params & Setup (7 cols) -->
      <div class="lg:col-span-7 flex flex-col gap-6">
        
        <!-- Security API Key Console -->
        <div class="bg-[#1c1c24] border border-white/10 rounded-3xl p-6 shadow-bezel relative overflow-hidden group">
          <div class="absolute -top-12 -right-12 w-24 h-24 bg-brand-orange/5 rounded-full blur-xl group-hover:bg-brand-orange/10 transition-all"></div>
          <div class="flex justify-between items-center mb-3">
            <label class="font-mono text-[9px] text-slate-300 font-bold flex items-center gap-2 tracking-widest uppercase">
              <i data-lucide="shield-check" class="w-4 h-4 text-brand-orange"></i>
              <span>Masukkan Api Key</span>
            </label>
            <span id="apikey-status-badge" class="text-[8px] font-mono text-rose-400 bg-rose-400/10 border border-rose-400/20 px-2.5 py-0.5 rounded-md flex items-center gap-1.5 font-bold transition-all">

              Terkunci
            </span>

                <i data-lucide="key-round" class="w-4 h-4"></i>

                <i data-lucide="eye" id="toggle-key-icon" class="w-4 h-4"></i>
              </button>
            </div>
          </div>
        </div>

          <div class="flex flex-col gap-2 mb-5 pb-4 border-b border-white/[0.06]">
            <div class="flex justify-between items-center">
              <div class="flex items-center gap-2">
                <span id="active-api-category" class="text-[9px] font-mono text-brand-orange bg-brand-orange/10 border border-brand-orange/20 px-2.5 py-0.5 rounded-full font-bold uppercase tracking-wider">Kategori</span>
                <span id="active-api-plan-badge" class="hidden"></span>
              </div>
              <span id="selected-api-method" class="text-[9px] font-mono bg-emerald-500/10 text-emerald-400 font-bold px-2.5 py-0.5 rounded-full border border-emerald-500/20">GET</span>
            </div>
            <h2 id="active-api-name" class="font-display font-bold text-lg tracking-tight text-white">Nama Api</h2>
            <p id="active-api-desc" class="text-xs text-slate-400 font-sans leading-relaxed">Deskripsi API akan dirender di sini.</p>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-5" id="params-form-inputs">
            <!-- Dynamic input parameters -->
          </div>
          
          <div class="mt-6 pt-5 border-t border-white/[0.06]">
            <button id="execute-btn" onclick="executeApiSandbox()" class="w-full bg-gradient-to-r from-orange-500 to-amber-500 hover:from-orange-400 hover:to-amber-400 text-black py-3.5 rounded-2xl font-display font-bold text-sm tracking-wider flex items-center justify-center gap-2.5 shadow-lg hover:shadow-orange-500/20 transition-all duration-300 cursor-pointer active:scale-[0.99]">
              <i data-lucide="play" class="w-4 h-4 fill-black"></i>
              <span>Kirim Permintaan</span>
            </button>
          </div>
        </div>

        <div class="bg-[#1c1c24] border border-white/10 rounded-3xl p-6 shadow-bezel relative overflow-hidden">
          <div class="flex justify-between items-center mb-4 pb-3 border-b border-white/[0.06]">
            <span class="font-mono text-[9px] font-bold text-white tracking-widest flex items-center gap-2 uppercase">
              <i data-lucide="code-2" class="w-4 h-4 text-brand-orange"></i>
              <span>Integrasi Kode (SDK)</span>
            </span>
            <span class="text-[8px] font-mono text-slate-400 tracking-widest uppercase">Client Snippets</span>
          </div>

          <!-- Tab Headers -->
          <div class="flex gap-2 mb-4 border-b border-white/[0.06] pb-2">
            <button onclick="switchSdkTab('curl')" id="sdk-tab-curl" class="sdk-tab bg-gradient-to-r from-orange-500 to-amber-500 text-black px-3.5 py-1.5 rounded-xl text-xs font-mono font-bold transition-all cursor-pointer shadow-md">cURL</button>
            <button onclick="switchSdkTab('node')" id="sdk-tab-node" class="sdk-tab bg-[#14141c] hover:bg-[#1f1f2a] text-slate-200 hover:text-white border border-white/10 hover:border-brand-orange/40 px-3.5 py-1.5 rounded-xl text-xs font-mono font-bold transition-all cursor-pointer">Node.js</button>
            <button onclick="switchSdkTab('python')" id="sdk-tab-python" class="sdk-tab bg-[#14141c] hover:bg-[#1f1f2a] text-slate-200 hover:text-white border border-white/10 hover:border-brand-orange/40 px-3.5 py-1.5 rounded-xl text-xs font-mono font-bold transition-all cursor-pointer">Python</button>
            <button onclick="switchSdkTab('php')" id="sdk-tab-php" class="sdk-tab bg-[#14141c] hover:bg-[#1f1f2a] text-slate-200 hover:text-white border border-white/10 hover:border-brand-orange/40 px-3.5 py-1.5 rounded-xl text-xs font-mono font-bold transition-all cursor-pointer">PHP</button>
          </div>

          <!-- Code Snippet Area -->
          <div class="relative bg-black/60 rounded-2xl border border-white/[0.06] p-4 overflow-hidden">
            <pre class="text-[11px] font-mono text-slate-300 leading-relaxed overflow-x-auto select-all max-h-[180px]" id="sdk-code-block"><code></code></pre>
            <button onclick="copySdkCode(this)" class="absolute top-3 right-3 bg-[#1c1c24] hover:bg-brand-orange/10 border border-white/10 hover:border-brand-orange/30 text-slate-400 hover:text-brand-orange p-2 rounded-xl transition-all cursor-pointer flex items-center justify-center">
              <i data-lucide="copy" class="w-3.5 h-3.5"></i>
            </button>
          </div>
        </div>

      </div>

      <!-- RIGHT COLUMN: Console Output Renderer (5 cols) -->
      <div class="lg:col-span-5 flex flex-col gap-6 sticky top-24 min-w-0">

        <div class="bg-[#1c1c24] border border-white/10 rounded-3xl p-5 shadow-bezel flex flex-col gap-3 min-w-0 overflow-hidden">
          <div class="flex justify-between items-center text-[8px] font-mono font-bold">

            <span class="text-emerald-400 flex items-center gap-1 font-mono">

          <div class="flex items-stretch bg-[#121218] border border-white/[0.06] rounded-2xl overflow-hidden p-1 shadow-inner group focus-within:border-brand-orange/40 transition-all w-full min-w-0">
            <span id="active-request-url" class="font-mono text-xs text-brand-orange px-3 py-2 flex-grow overflow-x-auto whitespace-nowrap select-all scroll-smooth w-full block min-w-0">
              https://api.clutch.web.id/api/...
